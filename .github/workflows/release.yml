name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # 创建 Release 需要写权限

jobs:
  release:
    runs-on: macos-15  # arm64：产物为 Apple Silicon 原生应用
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install -e '.[ui,dev]' pyinstaller

      - name: Test
        run: python -m pytest -q

      - name: Build standalone app
        run: python scripts/build_release.py

      - name: Verify bundle
        run: |
          APP="build/dist/PortalKit.app"
          codesign --verify --deep --strict "$APP"
          plutil -lint "$APP/Contents/Info.plist"
          echo "版本: $(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 幂等：重打同一 tag 时先删旧 Release（保留 tag 本体），再按说明重建
          gh release delete "${GITHUB_REF_NAME}" --yes || true
          NOTES_FILE="RELEASE_NOTES/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "${GITHUB_REF_NAME}" \
              build/release/*.zip \
              --title "PortalKit ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          else
            gh release create "${GITHUB_REF_NAME}" \
              build/release/*.zip \
              --title "PortalKit ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
