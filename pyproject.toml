[project]
name = "portalkit"
version = "1.3.2"
description = "PortalKit — macOS 智能网络门户认证助手（CLI + 核心库 + 菜单栏应用）"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["pyobjc-framework-SystemConfiguration>=10"]  # rumps 已随 1.1.0 原生 NSStatusItem 重写移除

[project.scripts]
portalkit = "portalkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
