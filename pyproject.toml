[project]
name = "portalkit"
version = "1.1.0"
description = "PortalKit — macOS 智能网络门户认证助手（CLI + 核心库 + 菜单栏应用）"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["rumps>=0.4.0", "pyobjc-framework-SystemConfiguration>=10"]

[project.scripts]
portalkit = "portalkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
